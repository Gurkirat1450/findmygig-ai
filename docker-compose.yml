services:
  db:
    image: postgres:16
    container_name: findmygig-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: findmygig
    ports:
      - "5432:5432"
    volumes:
      - findmygig_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: findmygig-app
    ports:
      - "8000:8000"
    environment:
      # Note: "db", not "localhost" — inside Docker's network, services
      # reach each other by service name, not localhost.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/findmygig
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  findmygig_pgdata:
